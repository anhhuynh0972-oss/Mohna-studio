<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fabric swatches, tape measure and pattern paper in a studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1EBE2"/>
      <stop offset="1" stop-color="#E3D8C9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3A2A20" flood-opacity=".16"/>
    </filter>
    <pattern id="twill" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="2" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- pattern paper -->
  <g filter="url(#sh)" transform="rotate(-6 300 400)">
    <rect x="90" y="150" width="440" height="560" fill="#FBF8F2"/>
    <path d="M170 220 C240 260 300 250 350 220 L420 300 L400 640 L190 640 L170 300 Z" fill="none" stroke="#6B2335" stroke-width="2" stroke-dasharray="10 7"/>
    <path d="M300 300 L300 600" stroke="#202020" stroke-width="1" opacity=".4"/>
    <path d="M290 590 l10 14 l10 -14" fill="none" stroke="#202020" opacity=".4"/>
    <text x="220" y="690" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="4" fill="#202020" opacity=".55">FRONT BODICE · CUT 2</text>
  </g>
  <!-- swatches -->
  <g filter="url(#sh)">
    <rect x="640" y="140" width="210" height="260" fill="#6B2335" transform="rotate(5 745 270)"/>
    <rect x="640" y="140" width="210" height="260" fill="url(#twill)" transform="rotate(5 745 270)"/>
    <rect x="860" y="190" width="210" height="260" fill="#C9B8A3" transform="rotate(-4 965 320)"/>
    <rect x="860" y="190" width="210" height="260" fill="url(#twill)" transform="rotate(-4 965 320)"/>
    <rect x="740" y="430" width="210" height="260" fill="#2B2626" transform="rotate(3 845 560)"/>
    <rect x="740" y="430" width="210" height="260" fill="url(#twill)" transform="rotate(3 845 560)"/>
  </g>
  <!-- tape measure -->
  <path d="M40 760 C300 690 520 760 760 720 S1100 640 1200 680" fill="none" stroke="#E7C98F" stroke-width="34"/>
  <path d="M40 760 C300 690 520 760 760 720 S1100 640 1200 680" fill="none" stroke="#202020" stroke-width="34" stroke-dasharray="1.5 18" opacity=".45"/>
</svg>
