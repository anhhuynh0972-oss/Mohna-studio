<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Folded garment wrapped in tissue with a ribbon and order card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE5DA"/>
      <stop offset="1" stop-color="#DCCFBE"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F3"/>
      <stop offset="1" stop-color="#EFE8DE"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3A2A20" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="130" y="250" width="540" height="520" fill="url(#box)"/>
  </g>
  <path d="M130 250 L400 420 L670 250" fill="none" stroke="#D8CDBD" stroke-width="2"/>
  <path d="M170 300 C300 350 500 350 630 300 L630 730 L170 730 Z" fill="#6B2335" opacity=".92"/>
  <path d="M170 300 C300 350 500 350 630 300" fill="none" stroke="#4A1625" stroke-width="3"/>
  <path d="M230 420 C340 450 460 450 570 420" fill="none" stroke="#4A1625" stroke-width="2" opacity=".5"/>
  <!-- ribbon -->
  <rect x="385" y="250" width="30" height="520" fill="#202020" opacity=".85"/>
  <path d="M400 360 C340 300 300 330 330 370 C350 395 390 375 400 360 C410 375 450 395 470 370 C500 330 460 300 400 360 Z" fill="#202020"/>
  <!-- card -->
  <g transform="translate(470 620) rotate(8)" filter="url(#sh)">
    <rect x="0" y="0" width="230" height="150" fill="#F7F4EF"/>
    <text x="115" y="54" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="26" letter-spacing="6" fill="#6B2335">MŌNAH</text>
    <line x1="40" y1="76" x2="190" y2="76" stroke="#202020" opacity=".3"/>
    <text x="115" y="104" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#202020" opacity=".7">ORDER · THANK YOU</text>
  </g>
</svg>
