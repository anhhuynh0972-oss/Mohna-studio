<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Woven garment care label on linen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9E1D5"/>
      <stop offset="1" stop-color="#D9CDBC"/>
    </linearGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3h6M3 0v6" stroke="#B9AA95" stroke-width=".6" opacity=".5"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3A2A20" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#weave)"/>
  <!-- fold of fabric -->
  <path d="M0 640 C220 600 520 700 800 620 L800 1000 L0 1000 Z" fill="#CFC1AE" opacity=".6"/>
  <g transform="translate(400 470) rotate(-4)" filter="url(#soft)">
    <rect x="-150" y="-250" width="300" height="500" fill="#F7F4EF"/>
    <rect x="-150" y="-250" width="300" height="500" fill="url(#weave)" opacity=".5"/>
    <line x1="-150" y1="-212" x2="150" y2="-212" stroke="#6B2335" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="-150" y1="212" x2="150" y2="212" stroke="#6B2335" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="0" y="-140" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="46" letter-spacing="10" fill="#6B2335">MŌNAH</text>
    <text x="0" y="-104" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="8" fill="#202020">STUDIO</text>
    <line x1="-90" y1="-70" x2="90" y2="-70" stroke="#202020" stroke-width="1" opacity=".4"/>
    <text x="0" y="-20" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="3" fill="#202020">100% LINEN</text>
    <text x="0" y="14" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#202020" opacity=".7">SIZE · AU 10</text>
    <g transform="translate(-84 64)" fill="none" stroke="#202020" stroke-width="2" opacity=".75">
      <path d="M0 10 h36 l-4 24 h-28 z"/><path d="M6 18 q12 6 24 0"/>
      <path d="M56 34 l18 -26 l18 26 z"/><path d="M62 8 l24 26 M86 8 l-24 26"/>
      <rect x="112" y="6" width="28" height="28"/><circle cx="126" cy="20" r="9"/>
    </g>
    <text x="0" y="168" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#202020" opacity=".6">DESIGNED IN AUSTRALIA</text>
  </g>
</svg>
